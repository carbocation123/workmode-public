<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workmode 引文</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="./dialog.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <small>WORKMODE CITATION</small>
          <h1 id="title">搜索 Workmode 文献</h1>
          <p id="project-name">正在连接 Workmode…</p>
        </div>
        <button class="quiet" id="close" type="button">关闭</button>
      </header>

      <section class="status-only" id="status-only" hidden>
        <p id="status-message"></p>
      </section>

      <div id="workspace">
        <section class="toolbar">
          <label class="search">
            <span>搜索 Workmode 文献</span>
            <input id="search" type="search" placeholder="标题、作者、期刊、DOI 或标签" autofocus />
          </label>
          <label>
            <span>引文样式</span>
            <select id="style"></select>
          </label>
        </section>

        <p class="message" id="message" role="status"></p>
        <section class="paper-list" id="papers" aria-live="polite"></section>

        <details class="modifiers">
          <summary>页码、前后缀等高级选项</summary>
          <div class="modifier-grid">
            <label><span>前缀</span><input id="prefix" placeholder="例如：参见" /></label>
            <label><span>后缀</span><input id="suffix" placeholder="例如：及其补充材料" /></label>
            <label>
              <span>定位类型</span>
              <select id="locator-label">
                <option value="page">页码</option>
                <option value="chapter">章节</option>
                <option value="figure">图</option>
                <option value="table">表</option>
                <option value="section">小节</option>
              </select>
            </label>
            <label><span>页码或定位信息</span><input id="locator-value" placeholder="例如：12–14" /></label>
            <label class="checkbox"><input id="suppress-author" type="checkbox" />隐藏作者</label>
          </div>
        </details>

        <section class="actions">
          <span>已选 <strong id="selected-count">0</strong> 篇</span>
          <button class="primary" id="insert" type="button" disabled>插入所选文献</button>
        </section>

        <section class="existing" id="existing">
          <h2>当前文档中的 Workmode 引文</h2>
          <div id="citation-groups"></div>
        </section>

        <details class="token">
          <summary>Workmode 启用了本地访问口令？</summary>
          <label>
            <span>连接口令</span>
            <input id="token" type="password" autocomplete="off" />
          </label>
          <button id="save-token" type="button">保存并重新连接</button>
        </details>
      </div>
    </main>
    <script type="module" src="./dialog.ts"></script>
  </body>
</html>
